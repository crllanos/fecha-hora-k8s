apiVersion: apps/v1
kind: Deployment
metadata:
  name: fecha-hora-k8s-frontend
  namespace: fecha-hora-k8s
spec:
  replicas: 1
  selector:
    matchLabels: {app: fecha-hora-k8s-frontend}
  template:
    metadata:
      labels: {app: fecha-hora-k8s-frontend}
    spec:
      containers:
        - name: fecha-hora-k8s-frontend
          image: fecha-hora-k8s-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: fecha-hora-k8s-frontend
  namespace: fecha-hora-k8s
spec:
  type: NodePort
  selector: {app: fecha-hora-k8s-frontend}
  ports:
    - port: 80
      nodePort: 30080